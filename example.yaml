esphome:
  name: toshiba-ab-debugger
esp8266:
  board: esp12e
logger:
  baud_rate: 0  # Free UART0 for the receiver.
  level: DEBUG
  tx_buffer_size: 1024
external_components:
  - source:
      type: local
      path: components
    components: [toshiba_ab]
toshiba_ab:
  debug_mode: raw
  frame_gap: 20ms
  rx_pin: 13  # Owned hardware UART0, swapped from GPIO3.
  baud_rate: 2400
  data_bits: 8
  parity: EVEN
  stop_bits: 1
